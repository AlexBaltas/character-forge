name: Deploy Character Forge

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::491085406494:role/character-forge-github-actions-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t character-forge .

      - name: Tag Docker image
        run: |
          docker tag character-forge:latest \
          491085406494.dkr.ecr.us-east-2.amazonaws.com/character-forge:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          491085406494.dkr.ecr.us-east-2.amazonaws.com/character-forge:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-2 | \
            docker login --username AWS --password-stdin 491085406494.dkr.ecr.us-east-2.amazonaws.com

            docker pull 491085406494.dkr.ecr.us-east-2.amazonaws.com/character-forge:latest

            docker rm -f character-forge || true

            docker run -d \
              --name character-forge \
              --restart unless-stopped \
              -p 80:80 \
              491085406494.dkr.ecr.us-east-2.amazonaws.com/character-forge:latest